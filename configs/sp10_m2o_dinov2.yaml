# BASELINE for the course project (PLAN_LID_SELF_CONDITIONING.md, run E1):
# the paper's Sign2(LID+Text), SP-10 many-to-one (10 SLs -> English, Table 4),
# lambda=(1,5,3), on frozen DINOv2 ViT-S/14 frame features instead of the
# unavailable spoken-text-supervised SlowFastSign features.
extends: sp10_many_to_one.yaml

model:
  d_feat: 384             # DINOv2 ViT-S/14 CLS embedding size (scripts/extract_features_dinov2.py)

optimizer:
  lr: 1.0e-4              # DEVIATION from the paper's 1e-3 (applied to baseline AND proposed).
                           # With our implementation 1e-3 stalls on the "ignore the video"
                           # plateau (go/no-go run: dev BLEU 0.01, loss flat at ~124, early
                           # stop at epoch 13). On 160 real clips, 60 epochs: lr 1e-3 never
                           # leaves loss 50.6 / BLEU 0; lr 1e-4 reaches loss 11 / BLEU 99.7.

decode:
  final_strategy: greedy   # final dev/test decoding. DEV-SET choice, same for baseline and proposed:
                            # on dev, greedy 4.99 / beam5 4.73 / beam5+CTC0.3 4.06 (baseline seed 1) and
                            # greedy 4.79 / beam5 4.63 / beam5+CTC0.3 3.86 (proposed seed 1) —
                            # our CTC rescoring lowers BLEU for both. beam is still available:
                            # scripts/evaluate.py --strategy beam [--ctc-weight W]

training:
  batch_size: 16          # 4 GB RTX 3050; paper used 64 on an A100
  grad_accum_steps: 2     # effective batch 32
  max_epochs: 100          # hard cap; early stopping on dev BLEU normally fires first

data:
  feature_cache_dir: data/features/sp10_dinov2
  require_real_features: true
